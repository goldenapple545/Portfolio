<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Редактор проектов для статического портфолио Егора Виктурова."
    />
    <meta name="theme-color" content="#e8833a" />
    <title>Egor Vikturov - Project Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="./assets/js/editor.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Основная навигация">
        <ul class="nav-links">
          <li><a href="./index.html#home">Главная</a></li>
          <li><a href="./projects.html">Проекты</a></li>
          <li><a href="./music.html">Музыка</a></li>
          <li><a href="./editor.html" class="active" aria-current="page">Редактор</a></li>
        </ul>

        <a class="nav-logo" href="./index.html" aria-label="Egor Vikturov">
          <span class="nav-logo-placeholder">EV</span>
        </a>

        <div class="nav-right">
          <a href="./projects.html" class="btn-nav">К проектам</a>
        </div>
      </nav>
    </header>

    <main class="editor-page">
      <section class="page-header editor-header" aria-labelledby="editor-title">
        <p class="eyebrow">Project Data</p>
        <h1 id="editor-title">Редактор проектов</h1>
        <div class="underline" aria-hidden="true"></div>
      </section>

      <section class="editor-shell" aria-label="Редактор данных проекта">
        <aside class="editor-sidebar">
          <div class="editor-toolbar">
            <button class="btn-primary" type="button" data-action="new">Новый проект</button>
            <button class="btn-outline" type="button" data-action="export">Экспорт JSON</button>
            <label class="file-button">
              Импорт JSON
              <input type="file" accept="application/json,.json" data-import-json />
            </label>
          </div>

          <div class="editor-note">
            Данные сохраняются в браузере. Для публикации экспортируй JSON и замени им
            `data/projects.json` в проекте.
          </div>

          <div class="project-editor-list" data-project-list></div>
        </aside>

        <form class="editor-form" data-project-form>
          <div class="form-grid">
            <label>
              Название
              <input name="title" type="text" required />
            </label>

            <label>
              Категория
              <input name="category" type="text" placeholder="VR Game · Unity" />
            </label>

            <label>
              Метка на картинке
              <input name="tag" type="text" placeholder="VR Game" />
            </label>

            <label>
              Обложка
              <input name="image" type="text" placeholder="URL или data:image..." />
            </label>

            <label>
              Загрузить обложку
              <input name="coverFile" type="file" accept="image/*" data-cover-file />
            </label>

            <label>
              Галерея
              <input name="gallery" type="text" placeholder="URL через запятую" />
            </label>

            <label>
              Добавить картинки в галерею
              <input name="galleryFiles" type="file" accept="image/*" multiple data-gallery-files />
            </label>

            <label>
              Технологии
              <input name="technologies" type="text" placeholder="Unity, C#, Blender" />
            </label>

            <label>
              Текст основной кнопки
              <input name="primaryActionLabel" type="text" placeholder="Открыть видео" />
            </label>

            <label>
              Ссылка основной кнопки
              <input name="primaryActionUrl" type="url" placeholder="https://..." />
            </label>

            <label>
              Текст второй кнопки
              <input name="secondaryActionLabel" type="text" placeholder="Подробнее" />
            </label>

            <label>
              Ссылка второй кнопки
              <input name="secondaryActionUrl" type="url" placeholder="https://..." />
            </label>
          </div>

          <label>
            Описание
            <textarea name="description" rows="5" required></textarea>
          </label>

          <label>
            Возможности
            <textarea name="features" rows="5" placeholder="Каждый пункт с новой строки"></textarea>
          </label>

          <label>
            Что я усвоил
            <textarea name="learnings" rows="4" placeholder="Каждый пункт с новой строки"></textarea>
          </label>

          <label class="checkbox-row">
            <input name="flipped" type="checkbox" />
            Развернуть карточку
          </label>

          <div class="editor-actions">
            <button class="btn-primary" type="submit">Сохранить проект</button>
            <button class="btn-outline" type="button" data-action="duplicate">Дублировать</button>
            <button class="btn-danger" type="button" data-action="delete">Удалить</button>
            <button class="btn-outline" type="button" data-action="reset">Сбросить локальные данные</button>
          </div>
        </form>
      </section>

      <section class="editor-preview" aria-labelledby="preview-title">
        <div class="preview-title-row">
          <h2 id="preview-title">Предпросмотр</h2>
          <a class="btn-outline" href="./projects.html">Открыть проекты</a>
        </div>
        <div class="projects-list preview-list" data-editor-preview></div>
      </section>
    </main>
  </body>
</html>
