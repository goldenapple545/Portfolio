<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Редактор проектов для статического портфолио Егора Виктурова."
      data-i18n-attrs="content:editorMetaDescription"
    />
    <meta name="theme-color" content="#e8833a" />
    <title data-i18n="editorPageTitle">Egor Vikturov - Project Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="./assets/js/i18n.js" defer></script>
    <script src="./assets/js/editor.js?v=12" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Основная навигация" data-i18n-attrs="aria-label:navAria">
        <ul class="nav-links">
          <li><a href="./index.html#home" data-i18n="navHome">Главная</a></li>
          <li><a href="./projects.html" data-i18n="navProjects">Проекты</a></li>
          <li><a href="./music.html" data-i18n="navMusic">Музыка</a></li>
          <li><a href="./editor.html" class="active" aria-current="page" data-i18n="navEditor">Редактор</a></li>
        </ul>

        <a class="nav-logo" href="./index.html" aria-label="Egor Vikturov">
          <img src="./assets/img/avatar.jpg" alt="Egor Vikturov" />
        </a>

        <div class="nav-right">
          <a href="./projects.html" class="btn-nav" data-i18n="backToProjects">К проектам</a>
          <div class="lang-switch" aria-label="Переключение языка" data-i18n-attrs="aria-label:langSwitchAria">
            <button class="active" type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="editor-page">
      <section class="page-header editor-header" aria-labelledby="editor-title">
        <p class="eyebrow">Project Data</p>
        <h1 id="editor-title" data-i18n="editorTitle">Редактор проектов</h1>
        <div class="underline" aria-hidden="true"></div>
      </section>

      <section class="editor-shell" aria-label="Редактор данных проекта" data-i18n-attrs="aria-label:editorShellAria">
        <aside class="editor-sidebar">
          <div class="editor-toolbar">
            <button class="btn-primary" type="button" data-action="open-file">Открыть data/projects.json</button>
            <button class="btn-primary" type="button" data-action="new" data-i18n="newProject">Новый проект</button>
            <button class="btn-outline" type="button" data-action="export" data-i18n="exportJson">Экспорт JSON</button>
            <label class="file-button">
              <span data-i18n="importJson">Импорт JSON</span>
              <input type="file" accept="application/json,.json" data-import-json />
            </label>
          </div>

          <div class="editor-note">
            Редактор работает только при локальном открытии editor.html как файла. Открой data/projects.json и сохраняй изменения в единый файл данных.
          </div>

          <div class="project-editor-list" data-project-list></div>
        </aside>

        <form class="editor-form" data-project-form>
          <div class="form-grid">
            <label>
              <span data-i18n="fieldTitle">Название</span>
              <input name="title" type="text" required />
            </label>

            <label>
              <span data-i18n="fieldCategory">Категория</span>
              <input name="category" type="text" placeholder="VR Game · Unity" />
            </label>

            <label>
              <span data-i18n="fieldImageTag">Метка на картинке</span>
              <input name="tag" type="text" placeholder="VR Game" />
            </label>

            <label>
              <span data-i18n="fieldCover">Обложка</span>
              <input name="image" type="text" placeholder="URL или data:image..." data-i18n-attrs="placeholder:placeholderImage" />
              <div class="image-manager" data-cover-preview></div>
            </label>

            <label>
              <span data-i18n="fieldCoverUpload">Загрузить обложку</span>
              <input name="coverFile" type="file" accept="image/*" data-cover-file />
            </label>

            <label>
              <span data-i18n="fieldGallery">Галерея</span>
              <input name="gallery" type="text" placeholder="URL через запятую" data-i18n-attrs="placeholder:placeholderGallery" />
              <div class="image-manager gallery-manager" data-gallery-manager></div>
            </label>

            <label>
              <span data-i18n="fieldGalleryUpload">Добавить картинки в галерею</span>
              <input name="galleryFiles" type="file" accept="image/*" multiple data-gallery-files />
            </label>

            <label>
              <span data-i18n="fieldTechnologies">Технологии</span>
              <input name="technologies" type="text" placeholder="Unity, C#, Blender" />
            </label>

            <label>
              <span data-i18n="fieldPrimaryLabel">Текст основной кнопки</span>
              <input name="primaryActionLabel" type="text" placeholder="Открыть видео" data-i18n-attrs="placeholder:placeholderOpenVideo" />
            </label>

            <label>
              <span data-i18n="fieldPrimaryUrl">Ссылка основной кнопки</span>
              <input name="primaryActionUrl" type="url" placeholder="https://..." />
            </label>

            <label>
              <span data-i18n="fieldSecondaryLabel">Текст второй кнопки</span>
              <input name="secondaryActionLabel" type="text" placeholder="Подробнее" data-i18n-attrs="placeholder:placeholderLearnMore" />
            </label>

            <label>
              <span data-i18n="fieldSecondaryUrl">Ссылка второй кнопки</span>
              <input name="secondaryActionUrl" type="url" placeholder="https://..." />
            </label>
          </div>

          <label>
            <span data-i18n="fieldDescription">Описание</span>
            <textarea name="description" rows="5" required></textarea>
          </label>

          <label>
            <span data-i18n="fieldFeatures">Возможности</span>
            <textarea name="features" rows="5" placeholder="Каждый пункт с новой строки" data-i18n-attrs="placeholder:placeholderLines"></textarea>
          </label>

          <label>
            <span data-i18n="fieldLearnings">Что я усвоил</span>
            <textarea name="learnings" rows="4" placeholder="Каждый пункт с новой строки" data-i18n-attrs="placeholder:placeholderLines"></textarea>
          </label>

          <label class="checkbox-row">
            <input name="flipped" type="checkbox" />
            <span data-i18n="fieldFlipped">Развернуть карточку</span>
          </label>

          <div class="editor-actions">
            <button class="btn-primary" type="submit" data-i18n="saveProject">Сохранить проект</button>
            <button class="btn-outline" type="button" data-action="duplicate" data-i18n="duplicate">Дублировать</button>
            <button class="btn-danger" type="button" data-action="delete" data-i18n="delete">Удалить</button>
            <button class="btn-outline" type="button" data-action="reset">Переоткрыть JSON</button>
          </div>
        </form>
      </section>

      <section class="editor-preview" aria-labelledby="preview-title">
        <div class="preview-title-row">
          <h2 id="preview-title" data-i18n="previewTitle">Предпросмотр</h2>
          <a class="btn-outline" href="./projects.html" data-i18n="openProjects">Открыть проекты</a>
        </div>
        <div class="projects-list preview-list" data-editor-preview></div>
      </section>
    </main>
  </body>
</html>
